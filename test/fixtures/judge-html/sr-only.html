<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sr-only</title>
  </head>
  <body style="margin: 0; font: 16px sans-serif">
    <button style="position: relative; width: 40px; height: 40px">
      *
      <span
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
        "
        >Dark mode</span
      >
    </button>
    <span style="position: absolute; top: 80px; left: 0; clip-path: inset(50%); white-space: nowrap"
      >Present</span
    >
    <p style="margin: 20px 0 0 100px">Orders service</p>
  </body>
</html>
