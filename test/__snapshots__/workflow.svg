<g class="t-node t-fam-task t-shape-subprocess" data-id="vendor" data-kind="subprocess" tabindex="0"><desc>Skipped for vendors already approved.</desc><rect class="t-node-box" x="471" y="425" width="172" height="72" rx="8"/><line class="t-node-rule" x1="479" y1="425" x2="479" y2="497"/><line class="t-node-rule" x1="635" y1="425" x2="635" y2="497"/><text class="t-text t-node-label" x="557" y="449.5" font-size="14" font-weight="600" text-anchor="middle"><tspan x="557" dy="0">Vendor onboarding</tspan></text><text class="t-text t-node-note" x="557" y="467.5" font-size="12" font-weight="400" text-anchor="middle"><tspan x="557" dy="0">Skipped for vendors</tspan><tspan x="557" dy="15.6">already approved.</tspan></text></g>
<g class="t-node t-fam-task" data-id="order" data-kind="task" tabindex="0"><rect class="t-node-box" x="286" y="557" width="118" height="44" rx="8"/><text class="t-text t-node-label" x="345" y="584" font-size="14" font-weight="600" text-anchor="middle"><tspan x="345" dy="0">Place order</tspan></text></g>
<g class="t-node t-fam-wait" data-id="delivery" data-kind="wait" tabindex="0"><rect class="t-node-box" x="261.5" y="661" width="167" height="44" rx="8"/><svg class="t-icon t-icon-wait" x="273.5" y="673" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg><text class="t-text t-node-label" x="303.5" y="688" font-size="14" font-weight="600"><tspan x="303.5" dy="0">Wait for delivery</tspan></text></g>
<g class="t-node t-fam-task" data-id="pay" data-kind="task" tabindex="0"><rect class="t-node-box" x="724" y="765" width="138" height="44" rx="8"/><text class="t-text t-node-label" x="793" y="792" font-size="14" font-weight="600" text-anchor="middle"><tspan x="793" dy="0">Send payment</tspan></text></g>
<g class="t-node t-fam-decision t-shape-diamond" data-id="paid" data-kind="decision" tabindex="0"><polygon class="t-node-box" points="793,869 868.5,907 793,945 717.5,907"/><text class="t-text t-node-label" x="793" y="911.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="793" dy="0">Bank accepted?</tspan></text></g>
<g class="t-node t-fam-end t-shape-end" data-id="end" data-kind="end" tabindex="0"><rect class="t-node-box" x="73" y="1005" width="72" height="36" rx="18"/><rect class="t-node-box t-node-inner" x="76" y="1008" width="66" height="30" rx="15"/><text class="t-text t-node-label" x="109" y="1027.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="109" dy="0">End</tspan></text></g>
