<svg xmlns="http://www.w3.org/2000/svg" class="diagram" viewBox="0 0 930 1117" role="img" aria-labelledby="t-title t-desc">
<title id="t-title">Purchase Request</title>
<desc id="t-desc">From a team&apos;s request to a paid vendor invoice.</desc>
<defs><marker id="t-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="t-arrow" d="M0 1L10 5L0 9z"/></marker><marker id="t-arrowhead-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path class="t-arrow t-arrow-async" d="M0 1L10 5L0 9z"/></marker></defs>
<style>
.t-text { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-kerning: none; font-variant-ligatures: none; font-feature-settings: "kern" 0, "liga" 0, "calt" 0; fill: var(--t-text, #1f2933); }
.t-group-title { fill: var(--t-muted, #52606d); }
.t-group-box { fill: var(--t-group-fill, #f5f7fa); stroke: var(--t-group-stroke, #cbd2d9); stroke-width: 1; }
.t-node-box { fill: var(--t-node-fill, #ffffff); stroke: var(--t-node-stroke, #9aa5b1); stroke-width: 1.25; }
.t-node:focus { outline: none; }
.t-node:focus-visible .t-node-box { stroke: var(--t-accent, #2f6fdb); stroke-width: 2.5; }
.t-icon { color: var(--t-icon, #52606d); }
.t-edge { fill: none; stroke: var(--t-edge, #2f6fdb); stroke-width: 1.5; stroke-linejoin: round; }
.t-edge-async { stroke: var(--t-edge-async, #803bce); }
.t-edge-data { stroke: var(--t-edge-data, #1a9386); }
.t-edge-reply { stroke: var(--t-edge-reply, #606e80); }
.t-edge-async { stroke-dasharray: 7 5; }
.t-edge-data { stroke-dasharray: 1.5 4.5; stroke-linecap: round; }
.t-arrow { fill: var(--t-edge, #2f6fdb); }
.t-arrow-async { fill: var(--t-edge-async, #803bce); }
.t-arrow-data { fill: var(--t-edge-data, #1a9386); }
.t-arrow-reply { fill: var(--t-edge-reply, #606e80); }
.t-label-bg { fill: var(--t-bg, #ffffff); stroke: none; }
.t-label { fill: var(--t-muted, #52606d); }

.t-node-inner { fill: none; }
.t-node-rule { stroke: var(--t-node-stroke, #9aa5b1); stroke-width: 1.25; }
.t-lane-band { fill: var(--t-lane-fill, transparent); stroke: none; }
.t-lane-odd .t-lane-band { fill: var(--t-lane-fill-odd, rgba(120, 130, 145, 0.08)); }
.t-lane-header { fill: var(--t-lane-header, rgba(120, 130, 145, 0.12)); stroke: none; }
.t-lane-rule { stroke: var(--t-group-stroke, #cbd2d9); stroke-width: 1; }
.t-lane-title { fill: var(--t-muted, #52606d); }
.t-fam-start .t-node-box { fill: var(--t-fam-start-fill, #e6f9ed); stroke: var(--t-fam-start-stroke, #259c4c); }
.t-fam-start .t-node-rule { stroke: var(--t-fam-start-stroke, #259c4c); }
.t-fam-start .t-icon { color: var(--t-fam-start-stroke, #259c4c); }
.t-fam-end .t-node-box { fill: var(--t-fam-end-fill, #f9e7e6); stroke: var(--t-fam-end-stroke, #be362d); }
.t-fam-end .t-node-inner { fill: none; }
.t-fam-end .t-node-rule { stroke: var(--t-fam-end-stroke, #be362d); }
.t-fam-end .t-icon { color: var(--t-fam-end-stroke, #be362d); }
.t-fam-decision .t-node-box { fill: var(--t-fam-decision-fill, #f9f4e6); stroke: var(--t-fam-decision-stroke, #a48227); }
.t-fam-decision .t-node-rule { stroke: var(--t-fam-decision-stroke, #a48227); }
.t-fam-decision .t-icon { color: var(--t-fam-decision-stroke, #a48227); }
.t-fam-wait .t-node-box { fill: var(--t-fam-wait-fill, #f4efeb); stroke: var(--t-fam-wait-stroke, #966f55); }
.t-fam-wait .t-node-rule { stroke: var(--t-fam-wait-stroke, #966f55); }
.t-fam-wait .t-icon { color: var(--t-fam-wait-stroke, #966f55); }
.t-fam-task .t-node-box { fill: var(--t-fam-task-fill, #e6eef9); stroke: var(--t-fam-task-stroke, #2d6cbe); }
.t-fam-task .t-node-rule { stroke: var(--t-fam-task-stroke, #2d6cbe); }
.t-fam-task .t-icon { color: var(--t-fam-task-stroke, #2d6cbe); }

.t-legend-label { fill: var(--t-muted, #52606d); }
.t-legend-line { fill: none; stroke: var(--t-edge, #2f6fdb); stroke-width: 1.5; stroke-linecap: round; }
.t-legend-async { stroke: var(--t-edge-async, #803bce); }
.t-legend-data { stroke: var(--t-edge-data, #1a9386); }
.t-legend-reply { stroke: var(--t-edge-reply, #606e80); }
.t-legend-async { stroke-dasharray: 7 5; }
.t-legend-data { stroke-dasharray: 1.5 4.5; }
.t-legend-reply { stroke-dasharray: 5 4; }

.t-node-note { fill: var(--t-text, #1f2933); fill-opacity: 0.75; }
</style>
<g class="t-lane" data-id="requester"><rect class="t-lane-band" x="0" y="0" width="228" height="1065"/><rect class="t-lane-header" x="0" y="0" width="228" height="40"/><line class="t-lane-rule" x1="228" y1="0" x2="228" y2="1065"/><text class="t-text t-lane-title" x="114" y="24.5" font-size="12" font-weight="600" text-anchor="middle"><tspan x="114" dy="0">Requester</tspan></text></g>
<g class="t-lane t-lane-odd" data-id="procurement"><rect class="t-lane-band" x="228" y="0" width="452.5" height="1065"/><rect class="t-lane-header" x="228" y="0" width="452.5" height="40"/><line class="t-lane-rule" x1="680.5" y1="0" x2="680.5" y2="1065"/><text class="t-text t-lane-title" x="454.25" y="24.5" font-size="12" font-weight="600" text-anchor="middle"><tspan x="454.25" dy="0">Procurement</tspan></text></g>
<g class="t-lane" data-id="finance"><rect class="t-lane-band" x="680.5" y="0" width="249.5" height="1065"/><rect class="t-lane-header" x="680.5" y="0" width="249.5" height="40"/><line class="t-lane-rule" x1="930" y1="0" x2="930" y2="1065"/><text class="t-text t-lane-title" x="805.25" y="24.5" font-size="12" font-weight="600" text-anchor="middle"><tspan x="805.25" dy="0">Finance</tspan></text></g>
<path class="t-edge t-edge-sync" data-from="start" data-to="submit" d="M109 100 L109 160" marker-end="url(#t-arrowhead)" data-edge="e0"/>
<path class="t-edge t-edge-sync" data-from="submit" data-to="check" d="M109 232 L109 242 L345 242 L345 292" marker-end="url(#t-arrowhead)" data-edge="e1"/>
<path class="t-edge t-edge-sync" data-from="check" data-to="vendor" d="M345 365 L345 375 L557 375 L557 425" marker-end="url(#t-arrowhead)" data-edge="e2"/>
<path class="t-edge t-edge-sync" data-from="check" data-to="reject" d="M345 365 L345 439" marker-end="url(#t-arrowhead)" data-edge="e3"/>
<path class="t-edge t-edge-sync" data-from="reject" data-to="end" d="M345 483 L345 507 L121 507 L121 1005" marker-end="url(#t-arrowhead)" data-edge="e4"/>
<path class="t-edge t-edge-sync" data-from="vendor" data-to="order" d="M557 497 L557 517 L345 517 L345 557" marker-end="url(#t-arrowhead)" data-edge="e5"/>
<path class="t-edge t-edge-sync" data-from="order" data-to="delivery" d="M345 601 L345 661" marker-end="url(#t-arrowhead)" data-edge="e6"/>
<path class="t-edge t-edge-async" data-from="order" data-to="pay" d="M364.5 601 L364.5 611 L816 611 L816 765" marker-end="url(#t-arrowhead-async)" data-edge="e7"/>
<path class="t-edge t-edge-sync" data-from="delivery" data-to="pay" d="M345 705 L345 725 L770 725 L770 765" marker-end="url(#t-arrowhead)" data-edge="e8"/>
