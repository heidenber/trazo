<g class="t-edge-label" data-edge="e3"><rect class="t-label-bg" x="306.5" y="390" width="77" height="24" rx="3"/><text class="t-text t-label" x="345" y="406" font-size="12" font-weight="400" text-anchor="middle"><tspan x="345" dy="0">over budget</tspan></text></g>
<g class="t-edge-label" data-edge="e7"><rect class="t-label-bg" x="566" y="599" width="49" height="24" rx="3"/><text class="t-text t-label" x="590.5" y="615" font-size="12" font-weight="400" text-anchor="middle"><tspan x="590.5" dy="0">invoice</tspan></text></g>
<g class="t-edge-label" data-edge="e10"><rect class="t-label-bg" x="871" y="862" width="35" height="24" rx="3"/><text class="t-text t-label" x="888.5" y="878" font-size="12" font-weight="400" text-anchor="middle"><tspan x="888.5" dy="0">retry</tspan></text></g>
<g class="t-edge-label" data-edge="e11"><rect class="t-label-bg" x="421.5" y="943" width="47" height="24" rx="3"/><text class="t-text t-label" x="445" y="959" font-size="12" font-weight="400" text-anchor="middle"><tspan x="445" dy="0">settled</tspan></text></g>
<g class="t-node t-fam-start t-shape-pill" data-id="start" data-kind="start" tabindex="0"><rect class="t-node-box" x="73" y="64" width="72" height="36" rx="18"/><text class="t-text t-node-label" x="109" y="86.5" font-size="13" font-weight="600" text-anchor="middle"><tspan x="109" dy="0">Start</tspan></text></g>
<g class="t-node t-fam-task" data-id="submit" data-kind="task" tabindex="0"><desc>Item, quantity and cost center.</desc><rect class="t-node-box" x="24" y="160" width="170" height="72" rx="8"/><text class="t-text t-node-label" x="109" y="184.5" font-size="14" font-weight="600" text-anchor="middle"><tspan x="109" dy="0">Submit request</tspan></text><text class="t-text t-node-note" x="109" y="202.5" font-size="12" font-weight="400" text-anchor="middle"><tspan x="109" dy="0">Item, quantity and cost</tspan><tspan x="109" dy="15.6">center.</tspan></text></g>
