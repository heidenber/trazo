<svg xmlns="http://www.w3.org/2000/svg" class="diagram t-state" viewBox="0 0 1295 498.1" role="img" aria-labelledby="t-title t-desc">
<title id="t-title">Purchase order</title>
<desc id="t-desc">Lifecycle of a purchase order: the happy path runs from Draft to Delivered; rejected and cancelled orders leave it.</desc>
<defs><marker id="t-arrowhead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="t-arrow" d="M1.8 1.8L8.4 5L1.8 8.2z"/></marker><marker id="t-arrowhead-exception" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="t-arrow t-arrow-exception" d="M1.8 1.8L8.4 5L1.8 8.2z"/></marker></defs>
<style>
.t-text { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-kerning: none; font-variant-ligatures: none; font-feature-settings: "kern" 0, "liga" 0, "calt" 0; fill: var(--t-text, #151a2b); }
.t-group-title { fill: var(--t-muted, #5a6379); }
.t-group-box { fill: var(--t-group-fill, #edf0f9); stroke: var(--t-group-stroke, #d3d9ea); stroke-width: 1; }
.t-node-box { fill: var(--t-card, #ffffff); stroke: var(--t-card-stroke, #dde2ee); stroke-width: 1; stroke-linejoin: round; }
.t-tint .t-node-box { fill: var(--t-f-fill, #ffffff); stroke: var(--t-f-stroke, #818694); stroke-width: 1.5; }
.t-tint .t-node-rule { stroke: var(--t-f-stroke, #818694); }
.t-chip { fill: var(--t-f-fill, #edf0f9); stroke: var(--t-f-stroke, #818694); stroke-opacity: 0.35; stroke-width: 1; }
.t-node:focus { outline: none; }
.t-node:focus-visible .t-node-box { stroke: var(--t-accent, #4457e8); stroke-width: 2.5; }
.t-icon { color: var(--t-f-stroke, var(--t-icon, #5a6379)); }
.t-edge { fill: none; stroke: var(--t-edge, #1b5eda); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.t-edge-async { stroke: var(--t-edge-async, #803bce); }
.t-edge-data { stroke: var(--t-edge-data, #1a9386); }
.t-edge-reply { stroke: var(--t-edge-reply, #606e80); }
.t-edge-async { stroke-dasharray: 6 5; }
.t-edge-data { stroke-dasharray: 0.1 5.2; stroke-width: 2.4; }
.t-arrow { fill: var(--t-edge, #1b5eda); stroke: var(--t-edge, #1b5eda); stroke-width: 1.4; stroke-linejoin: round; }
.t-arrow-async { fill: var(--t-edge-async, #803bce); stroke: var(--t-edge-async, #803bce); }
.t-arrow-data { fill: var(--t-edge-data, #1a9386); stroke: var(--t-edge-data, #1a9386); }
.t-arrow-reply { fill: var(--t-edge-reply, #606e80); stroke: var(--t-edge-reply, #606e80); }
.t-label-bg { fill: var(--t-label-bg, #ffffff); stroke: var(--t-border, #dde2ee); stroke-width: 1; }
.t-label { fill: var(--t-muted, #5a6379); }

.t-node-inner { fill: none; }
.t-node-rule { stroke: var(--t-node-stroke, #818694); stroke-width: 1.25; }
.t-lane-band { fill: var(--t-lane-fill, transparent); stroke: none; }
.t-lane-odd .t-lane-band { fill: var(--t-lane-fill-odd, #edf0f9); }
.t-lane-header { fill: var(--t-lane-header, #e9edf5); stroke: none; }
.t-lane-rule { stroke: var(--t-group-stroke, #d3d9ea); stroke-width: 1; }
.t-lane-title { fill: var(--t-muted, #5a6379); }
.t-fam-end { --t-f-fill: var(--t-fam-end-fill, #f9e7e6); --t-f-stroke: var(--t-fam-end-stroke, #be362d); }
.t-fam-end .t-node-inner { fill: none; }
.t-fam-task { --t-f-fill: var(--t-fam-task-fill, #e6eef9); --t-f-stroke: var(--t-fam-task-stroke, #2d6cbe); }

.t-legend-label { fill: var(--t-muted, #5a6379); }
.t-legend-item .t-legend-swatch { fill: var(--t-f-fill, #edf0f9); stroke: var(--t-f-stroke, #818694); stroke-width: 1.25; }
.t-legend-line { fill: none; stroke: var(--t-edge, #1b5eda); stroke-width: 1.7; stroke-linecap: round; }
.t-legend-async { stroke: var(--t-edge-async, #803bce); }
.t-legend-data { stroke: var(--t-edge-data, #1a9386); }
.t-legend-reply { stroke: var(--t-edge-reply, #606e80); }
.t-legend-async { stroke-dasharray: 6 5; }
.t-legend-data { stroke-dasharray: 0.1 5.2; stroke-width: 2.4; }
.t-legend-reply { stroke-dasharray: 5 4; }

.t-st-main { stroke-width: 2.6; }
.t-st-exc { stroke: var(--t-fam-end-stroke, #be362d); stroke-dasharray: 6 4.5; }
.t-arrow-exception { fill: var(--t-fam-end-stroke, #be362d); stroke: var(--t-fam-end-stroke, #be362d); }
.t-state .t-fam-end .t-node-box { stroke-dasharray: 5 4; }
.t-state-initial, .t-state-dot { fill: var(--t-text, #151a2b); stroke: none; }
.t-state-ring { fill: var(--t-card, #ffffff); stroke: var(--t-text, #151a2b); stroke-width: 1.8; }
.t-state-ev { fill: var(--t-text, #151a2b); }
</style>
